services:
  postgres:
    image: postgres:16-alpine
    container_name: skyvern-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skyvern}
      POSTGRES_USER: ${POSTGRES_USER:-skyvern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-skyvern} -d ${POSTGRES_DB:-skyvern}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
